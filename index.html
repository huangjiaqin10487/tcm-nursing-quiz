<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>中医药统计学 · 选择题与判断题练习</title>
<style>
  :root{
    --bg:#eef3f9; --card:#ffffff; --ink:#1b2735; --muted:#6b7c92;
    --brand:#1f4e79; --brand2:#2f7ab5; --line:#e2eaf3;
    --green:#178a5e; --green-bg:#e9f7f0; --red:#c9463f; --red-bg:#fdecea;
    --amber:#b7791f; --shadow:0 8px 24px rgba(24,58,92,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 50% -200px, #dcebfa 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 130px}
  /* ---------- 首页 ---------- */
  .hero{
    background:linear-gradient(135deg,#173f63 0%,#1f4e79 45%,#2f7ab5 100%);
    color:#fff;border-radius:26px;padding:30px 28px 26px;
    box-shadow:0 18px 40px rgba(23,63,99,.25);position:relative;overflow:hidden;
  }
  .hero:after{
    content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;
    border-radius:50%;background:rgba(255,255,255,.08);
  }
  .hero:before{
    content:"";position:absolute;right:40px;bottom:-90px;width:160px;height:160px;
    border-radius:50%;background:rgba(255,255,255,.06);
  }
  .eyebrow{font-size:12.5px;letter-spacing:.18em;opacity:.75}
  .hero h1{margin:10px 0 2px;font-size:34px;letter-spacing:.04em;font-weight:700}
  .hero .sub{margin:0;font-size:15px;opacity:.9}
  .hero-stats{display:flex;gap:18px;margin-top:20px;font-size:13px;opacity:.92;flex-wrap:wrap}
  .hero-stats b{font-size:20px;margin-right:2px}
  .resume{
    margin-top:16px;background:#fff8e8;border:1px solid #f0dcae;border-radius:14px;
    padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;
  }
  .resume small{display:block;color:#8a6a24;font-size:12px;margin-bottom:2px}
  .resume b{font-size:14px}
  .sec-title{margin:26px 4px 12px;font-size:14px;color:var(--muted);letter-spacing:.08em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;display:flex;gap:13px;align-items:center;text-align:left;
    box-shadow:0 3px 12px rgba(24,58,92,.04);transition:.18s;width:100%;
  }
  .mode:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#c9dcef}
  .mode .ico{
    width:44px;height:44px;border-radius:14px;flex:0 0 44px;display:grid;place-items:center;
    background:linear-gradient(135deg,#e8f2fc,#d7e9f9);color:var(--brand);font-weight:700;font-size:16px;
  }
  .mode .txt{flex:1;min-width:0}
  .mode .txt b{display:block;font-size:15.5px;line-height:1.3}
  .mode .txt span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .mode .num{font-size:12px;color:var(--brand);background:#eaf3fc;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .foot{margin:26px 4px 0;font-size:12px;color:var(--muted);line-height:1.9}
  /* 存档 */
  .arclist{display:flex;flex-direction:column;gap:10px}
  .arc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
  .arc-h{display:flex;align-items:baseline;gap:8px}
  .arc-h b{font-size:14.5px}
  .arc-t{margin-left:auto;font-size:11.5px;color:#93a3b7}
  .arc-s{font-size:12.5px;color:var(--muted);margin-top:4px}
  .arc-s b{color:var(--brand);font-size:13.5px}
  .arc-w{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .arc-w>span{font-size:11.5px;color:#9e2f29}
  .chip2{font-size:11px;color:#9e2f29;background:var(--red-bg);border:1px solid #efb6b1;border-radius:6px;padding:1px 6px}
  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:10px 0;margin-bottom:10px;background:rgba(238,243,249,.86);backdrop-filter:blur(10px);
  }
  .iconbtn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
    color:var(--brand);font-size:18px;display:grid;place-items:center;flex:0 0 38px;
  }
  .tb-title{flex:1;min-width:0;font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:8px}
  .tb-title span{font-size:12px;color:var(--muted);font-weight:400}
  .timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 10px;border-radius:10px}
  .textbtn{border:0;background:transparent;color:var(--brand);font-size:13px;padding:6px 2px}
  /* ---------- 进度 ---------- */
  .progress{height:7px;background:#dfe9f4;border-radius:99px;overflow:hidden;margin:2px 0 8px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,#2f7ab5,#1f4e79);border-radius:99px;transition:width .25s}
  .statline{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 2px 12px}
  .statline b{color:var(--ink)}
  .statline .ok b{color:var(--green)}
  .statline .no b{color:var(--red)}
  /* ---------- 题目卡 ---------- */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;box-shadow:var(--shadow)}
  .qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{font-size:11.5px;color:var(--brand);background:#eaf3fc;border-radius:999px;padding:3px 10px;letter-spacing:.03em}
  .pill.gray{color:var(--muted);background:#f2f5f9}
  .qno{margin-left:auto;font-size:12px;color:#93a3b7}
  .stem{font-size:17px;line-height:1.85;letter-spacing:.01em;word-break:break-word}
  .stem sub,.stem sup{font-size:72%}
  .opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
  .opt{
    width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;
    background:#fbfdff;border:1.5px solid #e2eaf3;border-radius:13px;padding:11px 13px;
    color:var(--ink);font-size:15px;line-height:1.65;transition:.14s;position:relative;
  }
  .opt:not(:disabled):hover{border-color:#a9c8e6;background:#f5faff}
  .opt .lab{
    flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:#eef4fa;color:#5c748e;font-size:12.5px;font-weight:700;margin-top:1px;
  }
  .opt .txt{flex:1;min-width:0;word-break:break-word}
  .opt .tag{font-size:10.5px;border-radius:6px;padding:2px 6px;white-space:nowrap;margin-left:auto;align-self:center}
  .opt.sel{border-color:var(--brand2);background:#eef6ff}
  .opt.sel .lab{background:var(--brand);color:#fff}
  .opt.correct{border-color:#7fc9a8;background:var(--green-bg)}
  .opt.correct .lab{background:var(--green);color:#fff}
  .opt.correct .tag{background:#cdeedd;color:#0f6b49}
  .opt.wrong{border-color:#e8a5a1;background:var(--red-bg)}
  .opt.wrong .lab{background:var(--red);color:#fff}
  .opt.wrong .tag{background:#f8d4d1;color:#9e2f29}
  .opt.dim{opacity:.62}
  .opt:disabled{cursor:default}
  .feedback{margin-top:15px;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
  .feedback.ok{background:var(--green-bg);color:#0f6b49}
  .feedback.no{background:var(--red-bg);color:#9e2f29}
  .feedback .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;line-height:1;flex:0 0 20px}
  .feedback.ok .mk{background:#178a5e}
  .feedback.no .mk{background:#c9463f}
  .exp{margin-top:10px;background:#f7f9fc;border-left:3px solid #a9c8e6;border-radius:0 10px 10px 0;padding:11px 14px;font-size:13.5px;color:#3c4d62;line-height:1.8}
  .exp b{color:var(--brand);font-size:12px;letter-spacing:.08em;display:block;margin-bottom:3px}
  .actions{margin-top:18px;display:flex;gap:10px}
  .btn{border:0;border-radius:12px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:.15s}
  .btn.primary{background:linear-gradient(135deg,#2f7ab5,#1f4e79);color:#fff;flex:1;box-shadow:0 6px 16px rgba(31,78,121,.22)}
  .btn.primary:disabled{background:#c9d6e3;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--brand)}
  .btn.soft{background:#eaf3fc;color:var(--brand)}
  /* ---------- 底部导航 ---------- */
  .navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.95);
    border-top:1px solid var(--line);backdrop-filter:blur(10px);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .navbar .inner{max-width:860px;margin:0 auto;display:flex;gap:9px}
  .navbar button{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;
    font-size:13.5px;color:var(--ink);
  }
  .navbar button.mid{flex:0 0 90px;color:var(--brand);background:#f2f8ff}
  .navbar button:disabled{opacity:.4;cursor:not-allowed}
  /* ---------- 答题卡 ---------- */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(15,32,50,.45);display:flex;align-items:flex-end;justify-content:center;padding:0}
  .sheet{background:#fff;width:100%;max-width:860px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet .hint{font-size:12px;color:var(--muted);margin-bottom:14px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:1px}
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
  .sheet-grid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;color:#51657b}
  .sheet-grid button.ok{background:#dcf2e7;border-color:#a9dcc6;color:#0f6b49}
  .sheet-grid button.no{background:#f9dedb;border-color:#efb6b1;color:#9e2f29}
  .sheet-grid button.sel{background:#dcecff;border-color:#a9c8e6;color:var(--brand)}
  .sheet-grid button.cur{outline:2px solid var(--brand);outline-offset:1px}
  /* ---------- 成绩 ---------- */
  .scorecard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;text-align:center;box-shadow:var(--shadow)}
  .ring{width:150px;height:150px;border-radius:50%;margin:4px auto 16px;display:grid;place-items:center;
    background:conic-gradient(var(--brand) calc(var(--p)*1%), #e4edf7 0)}
  .ring .in{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-direction:column}
  .ring b{font-size:33px;line-height:1;color:var(--brand)}
  .ring small{font-size:11px;color:var(--muted);margin-top:4px}
  .scorecard h2{margin:0 0 4px;font-size:19px}
  .scorecard p{margin:0;color:var(--muted);font-size:13px}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:11.5px;color:var(--muted)}
  .stat.ok b{color:var(--green)} .stat.no b{color:var(--red)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .chip{border:1px solid #efb6b1;background:var(--red-bg);color:#9e2f29;border-radius:8px;padding:4px 9px;font-size:12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
  .card h3{margin:0 0 8px;font-size:14px}
  /* ---------- 提示 ---------- */
  #toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(10px);background:rgba(27,39,53,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:620px){
    .wrap{padding:12px 12px 120px}
    .hero{padding:24px 20px;border-radius:22px}
    .hero h1{font-size:28px}
    .grid{grid-template-columns:1fr}
    .qcard{padding:16px 14px 14px;border-radius:16px}
    .stem{font-size:16px}
    .opt{font-size:14.5px;padding:10px 11px}
    .statgrid{grid-template-columns:repeat(2,1fr)}
  }
</style>
<style>
  /* ---- 新增：卡片进度、错题本 ---- */
  .mode{position:relative;cursor:pointer}
  .mode .txt .sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .mode .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
  .mode .badge{display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 5px;border-radius:9px;
    background:rgba(201,70,63,.12);color:#b83a33;font-size:11px;font-style:normal;text-align:center;margin-left:5px;vertical-align:1px}
  .mode .prog{display:block;font-size:11.5px;color:var(--brand);margin-top:4px}
  .mode .prog b{font-size:12.5px}
  .mode .prog.zero{color:#9aa9bb}
  .mode .redo{
    border:1px solid var(--line);background:#fff;color:#8fa1b5;font-size:11px;
    border-radius:8px;padding:2px 9px;line-height:1.6;
  }
  .mode .redo:hover{color:var(--red);border-color:#efb6b1}
  .mode.wrongcard{background:linear-gradient(135deg,#fff6f5,#ffffff);border-color:#f3d3cf}
  .mode.wrongcard .ico{background:linear-gradient(135deg,#fde8e6,#f9d7d3);color:#b83a33}

  .tfhint{background:#fff8e8;border:1px solid #f0dcae;color:#8a6a24;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:10px}
  .btn.danger{background:#fff;border:1px solid #efb6b1;color:#b83a33}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 10px}
</style>

</head>
<body>
<div id="app"></div>

<script>

寒证,虚证。)四. 病例分析:(8分)李某,男,51 岁,头痛一年,加重月余来诊。一年来,头痛时发时止,发作日头痛较剧,胀痛,并兼眩晕,血压不稳,时而偏高。平时工作紧张,性情急躁多忧多虑,夜寐欠安,舌质红,苔薄黄,脉弦。要求:诊断,护治原则,方药,护理。(答:头痛,肝阳头痛;平肝潜阳;天麻钩藤饮加减;护理:1.稳定患者的情绪,避免一切不良刺激,周围环境宜安静,室内光线!略偏暗为宜。2. 对病人态度和蔼,语言柔和,切忌大声喧哗。3. 定时测量血压,观察病情的变化,头痛较重者,应卧床休息,宜取头產脚低位。中友复即店.丸食第一《中医临床护理学》小测试题一、单项选择题(本题共10题,每小题2分,共20分)1. 水肿的辩证应以何 纲是(b)A、表里B、阴阳C、寒热D、虚实2. 患者王某,女性,42岁,平常月经量较多。两天前无明显诱因,发热。37.6度,伴有头晕眼花,心悸不宁,面色少华,唇淡,舌淡,脉细弱。证属(B)A、阴虚发热 B、血虚发热C、瘀血发热D、气虚发热3.患者梁某,男性,20岁,症见胃痛暴作,恶寒喜暖,喜热饮,苔薄白,脉弦紧。证属(A)A、寒邪客胃B、肝郁气滞C、瘀血阻络D、饮食停滞"],"a":0,"e":"","t":"single"},{"q":"患者陈某,就诊时症见,壮热、口渴、头痛、烦躁,甚至神昏、抽搐,腹痛、里急后重特甚,痢下鲜紫胶血,舌质红绛,苔黄燥,脉滑数。证属","o":["湿热痢","噤口痢","休息痢","疫毒痢"],"a":3,"e":"","t":"single"},{"q":"感冒的病机为","o":["六淫犯肺","肺气失宜","卫表不和","气血不和"],"a":0,"e":"","t":"single"},{"q":"着痹的特点是","o":["疼痛部位呈游走性","痛有定处,以酸胀重着肌肤不仁为主","疼痛剧烈,遇寒尤甚","关节局部红肿热痛,难以屈伸"],"a":1,"e":"","t":"single"},{"q":"呕吐的主要病机是(A)第1页共10页--","o":["胃气上逆","肝气犯胃","脾胃虚寒","胃气动膈"],"a":0,"e":"","t":"single"},{"q":"呕吐病证的吐出物多为","o":["食物","痰涎","水液","无物","咖啡样物13. 痢疾发病特点是(ABCDE)A、多具有传染性B、多发于夏秋季节C、腹痛D、里急后重 E、痢下赤白脓血"],"a":0,"e":"","t":"single"},{"q":"阴黄与阳黄的鉴别要点有","o":["起病之急缓","病程之长短","黄色之鲜明与晦暗","尿色之黄与不黄 E、脉象之迟数三、名词解释(本题共4题,每小题5分,共20分)16. 感冒:是感受触冒风邪,邪犯卫表而导致的常见外感疾病,以鼻塞、鼻涕、喷涕、头痛、严寒、发热、全身不适等为主要临床表现。17. 癃闭:是由于肾和膀跳气化失司而导致尿量减少,排尿困难,甚则小便闭塞不通力主要临床表现的病证。18. 便秘:是因气阴不足,或燥热内结,腑气不畅所致,以大便秘结不通,排便问隔时间延长,或排便艰涩不畅为主要临床表现的病证。19. 消渴:是因先天禀赋不足,复因饮食不节,情志失调等等导致机体阴虚燥热,出现以多饮、多食多尿,形体消瘦为主要临床表现的病证。第2页共10页四、简答题(本题共2颞,每小题15分,共30分)20. 请简述溫泻患者的一般护理措施。21. 请简述鼓胀患者的饮食护理要点。五、病例分析题(本题共1題,每小题20分,共20分)22. 患者杨某,女,32岁,尿频、尿急、尿痛反复发作多年,病情发作时经治疗症状可减轻。四天前因工作劳累,睡眠时间不足而复发,就诊时尿痛不甚,但尿频尿急,每次量不多,伴有下腹坠胀感,神疲乏力,大便溏薄,舌质淡,脉弱。请回答下列问题:(1)此属什么病证?证型?(2分)(2)治法?主方?(2分)(3)饮食护理有何要求?(6分)简述题:1、简述月经先期血热型的中医护理特点(分阴虚血热/阳盛血热/肝郁化热三个方面)。答:阴虚血热:第3页共10页1)注意求体息,避兔过劳和则烈运动,如打球。游冰、跑步等,避免淋兩和统冷水澡等。。2)嘱病人多饮开水,以充分补水,汗出时应及时擦干,以防着凉。3)中药汤剂不宜久煎,宜偏凉服。可选用鸟鸡白风丸或六味地黄丸,经后始服,经行停药。4)平时配合滋阴生津之食疗。如:炖甲鱼、玉竹煲鸡菇汤、茜草鸟龟汤、淡莱墨鱼汤、阿胶炖瘦肉、等,多食鱼肉、蛋、银耳及各种新鲜蔬葉和水果、亦可频服莲藕汁、甘蔗汁以清热生津,忌燥热、辛辣刺激助阳之品。5)保持心情舒畅,避免激动,忧郁过度等情绪变化。6)可用针灸治疗的方法:取关元、血海、三阴交等穴,毫针刺平补平泻法。7)数导病人有关本病的知识。对己婚妇女做好计划生育宜教工作,指导病人使用合适的有效的节育措施,尽量减少人流损害宫腔,宣节制房事,防止房劳伤肾。阳盛血热:1)如有腹痛禁止热敷下腹。注意多休息,劳逸结合,避免剧烈运动。2)可服食藕汁、生地汁、鲜旱莲草汁等以清热凉血止血,忌食辛辣煎炸助阳动火之品。3)中药汤剂宜饭后凉服。可选用固经丸或宫泰冲剂。4)针灸方法:取关元、气海、曲池、三阴交等穴,毫针刺用平补平泻法。5)保持情绪稳定,避免烦躁、恼怒等不不良情绪的刺激。6) 指导病人有关本病的知识。肝郁化热:1)生活起居有常,注意多休息,劳逸结合,避免剧烈运动等。2)饮食宜选用月季花粥,或用佛手10g泡茶,随意饮用,忌食辛辣刺激之品。3)中药汤剂宜饭后凉服。可选用丹栀逍遥丸服用。4)调整心态,以保持气血平和,心情舒畅,避免精神刺激,树立战胜疾病的信心。5) 针灸方法:取气海、三阴交、太冲等穴,毫针刺用泻法。6)教导病人有关本病的知识。对已婚妇女做好计划生育宣教工作,指导病人使用合适的有效的节育措施,尽量减少人流损害宫腔,宣节制房事,防止房劳伤肾。第4页共10页2、简述月经后期血虚型的中医护理要点。答:月经后期血虚型的中医护理要点力:1)病室环境保持整洁、舒适、安静、空气新鲜,室温宜偏暖,根据气候变化均减衣被,注意保暖。2)应卧床休息,经期不宜劳累。3)多与患者交流,以了解其生活起居、饮食、睡眼情志等情况:及时与病人的家属共同做好病人的情志护理。4)严密观察病人的面色、脉象、舌脉、汗出、二便、月经周期等,必要时嘱病人保留经垫,估计出血量或观察经血的颜色。5)保持外阴清洁,指导阴道分泌物多的病人每日清洁会阴,对不能自理者,每日应予会阴消毒1-2次,勤换内裤及经垫,内裤在阳光下暴晒6小时以上或及时烘干。6)加强营养,胃纳佳者,可进血肉有情之品补之,如瘦肉、猪肝、肌肉、鱼肉之类;如脾胃欠佳者,则宜先健运脾胃,以素食为主,适当顿服精瘦肉准杞子汤,或牛腩杞子汤。忌辛辣油腻之品。7)中药汤剂宜用文火久煎,热服、顿服。8) 按医嘱准确给药,观察药后效果和反应。9)保持大便通畅,减少腹压,防止出血。有传染病者,执行传染病隔离常规;如须刮宫者,按刮宫护理。3、简述气滞血瘀型/寒凝血瘀痛经的中医护理要点。答:气滞血痰型痛经中医护理要点:1)药物方法:偏气滞者,选用七制香附丸或坤顺丹;偏血瘀者,选用痛经丸;痛时亦可服元胡粉1.5g,每日2次。2)外治法:丁香、肉桂、元胡、木香各10g,研末和匀,于经前两天或疼痛发作时,取2g药粉置胶布上,贴关元穴;若疼痛不止,加贴双侧三阴交穴。3)针灸方法:取中极、气海、血海、三阴交、太冲、合谷等穴,毫针用泻法。第5页共10页4) 推拿方法:睡前排尿后仰卧,由中极至气海、天枢至归来反复揉技约3-5min,手法由轻至重,用拇指点按气海穴 2min,用拇指揉捏双侧三阴交穴约2min。5)饮食方法:选用桃仁生地粥或选用糖醋益母膏。6)情志方法:帮助患者解决心理负担,开导其乐观对待生活,保持心情舒畅。7)指导患者本病的相关知识及注意月经期的经期卫生。8) 注意多休息,劳逸结合,防止过劳,节制房事。寒凝血瘀痛经的中医护理要点:1)药物方法:选用艾附暖宫丸或温经丸。或用艾叶 10g,生姜2片,红糖适量,水煎服,每日2次。外治法:肉桂、细辛、吴茱萸、元胡、乳香、没药各10g研末拌匀,于经前2天取药粉2-3g置于5号阳和膏中粘匀,贴于神阙穴处,隔日一次,至行经3天止。三个月经周期为一疗程。2)针灸方法:针刺关元、中极、地机、三阴交;艾灸气海、关元、次膠、阿是穴。3)饮食方法:选用桂浆粥。忌食辛辣刺激生冷的食物。4)注意多休息,注意保暖,特别是腹部、腰部,劳逸结合,避免过劳和纵欲过度、5)保持心情舒畅,避免精神刺激,戒郁怒。6) 与患者讲解有关本病的相关知识。4、简述肾阴虚型/肾阳虚型“绝期前后诸证”的中医护理要点。答:1)注意休息,室内保持整洁、安静,空气流通。肾阴虚者病室宜凉爽、光线柔和;肾阳虚病室宜阳光充足,注意保暖,勿受风寒。2)做好情志护理。医务人员应耐心解答病人提出的问题,并予指导解决。对病人恐惧优虑的心理可采用心理疏导、家庭调节。避兔不良的精神刺激,对失眠、烦躁不安及情绪激动者,可按医嘱适当用镇静剂。3)合理安排生活,适当调节或保持工作的节奏与休息的关系,避免过重的工作负担。4)饮食宜清淡且营养丰富,应多食各种新鲜水果及蔬菜,少食油腻及含脂肪较高的食物,少吃糖,避免高盐饮食,注意补充钾和钙,每日补充钙约1g,即每第6页共10页日造成和睡前饮一杯热鲜奶。对于月经频繁,经血量多,出血时间延长时,饮食宜选高蛋白、含铁多的食物,如鸡蛋、动物内脏、牛、羊、瘦肉及牛奶等。肾阴虚宜低盐,可佐以滋补肝肾之品,如枸杞子、何首乌等煲汤或煮粥食用。肾阳虚者宜选一些温补之品,如牛肉、猪肝、猪腰。冬季宜食羊肉、狗肉等以温肾阳,浮肿者宜低盐饮食,并可选食冬瓜、赤小豆、鲤鱼汤,以利水消肿,可佐以温补肾阳之品,食欲不佳,厌油腻者可用红枣、桂圆煲汤饮用。5) 注意阴部清洁卫生,勤换经垫及内裤,经期忌盆浴,预防泌尿生殖器发生感染。6)教会病人观察月经周期、阴道排出物、出血量正常与异常等情况,如出现异常,应报告医护人员,以使能得到及时处理。7)经常巡视病房,了解病人的生活所需及思想动态,及时予以解决。8)肾阴虚者中药宜饭前温服,每日1次,肾阳虚者宜饭前热服,并观察服药后效果和反应。9)注意劳逸结合,调畅情志,保持乐观,避免精神刺激,定期体检。5、简述肾虚型胎动不安的中医护理要点。答:1)病室空气清新,温湿度适宜,宜安静,注意多休息和保暖,避风寒,慎起居、防止外感等疾病发生。2) 药物方法:选用寿胎丸。补肾健脾,补气养血安胎等补益药物宜文火久煎,饭前温服。3)饮食方法:选用艾叶鸡蛋汤。或菟丝子粥,每日早晚热服。宜多吃蔬菜和水果,保持大便畅通;若大便秘结者,每日早晚服蜂蜜1匙;或麻仁丸6g:每晚1次,以利润肠通便,减少腹压,防止再度出血。4)情志方法:保持情绪安定,做好精神护理,孕期严禁房事,避免劳力持重。5) 向患者及家属说明流产的可能原因,以及经积极稳妥治疗后,大多可继续正常妊娠、分娩健康婴儿。解除不必要的顾虑和紧张情绪,抑郁、忧思、恼怒、悲伤均可影响气机,使气血逆乱,胎失载养。6、简述气血虚弱型胎漏的中医护理要点。第]页共10页答:1)病室宜空气流通、整洁、舒适,湿、温度适宜。注意保暖,室温宜偏暖,告知孕妇/配偶暂停性生活。2)经常巡视病房,了解病人的生活所需,协助料理生活,外出检查应有人陪同,勿让病人单独去厕所,勿使用蹲厕,尽可能使病人适应使用便盆,以收集和观察排出物、出血的色、质、量情况,并做好记录。3)阴道流血时应绝对卧床休息,待症状消失后可适当下床活动。并向病人说明诱发胎漏的原因,避免过劳、攀高举重、灌肠、阴道检查及情绪变化无常等因素诱发胎漏。4)饮食宜营养丰富、易消化之食品,如鸡蛋、牛奶、瘦肉、鱼类、蔬菜、水果等,以提供胎儿生长发育的需要。忌生冷寒凉滑利或辛辣刺激之品,如薏苡仁、绿豆等。气虚者多食益气健脾养血之品,中药汤剂宜文火久煎,热服。5)保持大便通畅,如大便燥结难解者,每日早晚用温开水冲蜂蜜饮用以润肠通便,减少腹压,防止出血。6)保持外阴清洁,勤换巾垫及内裤,每天用温水或1:5000高锰酸钾溶液清洁会阴1-2次,预防感染。7)指导病人正确测量基础体温,若病人的晨温不降一般提示预后良好,若晨温下降者,多提示保胎希望不大。8)有高血压病史者,每天测量血压和体重,以便医疗提供依据。9)保证充足睡眠,失眠者可以通过听音乐、喝热牛奶、热水泡足等方法诱导睡眠。10)做好健康指导:指导病人孕期保健,慎房事,慎起居,生活要有规律,防止感冒的发生,避免负重攀高,防止跌扑,保证睡眠充足,重胎教、利优生宽衣带,定期作孕期保健检查,确保优生优育。如有坠胎、小产、滑胎病史,则夫妻双方要作检查,如出现孕期下血、要卧床休养,并接受医护指导,不能自行用药,凡安胎失败者,嘱下次受孕时间相隔不能太近,应避孕半年至一年再孕,以利于肾气复原,恢复胞宫功能,防止下次漏胎发生。病例题:1、中医护理在临床中的实际应用,举两到三个病例谈你如何运用中医护理的方法帮助护理病人。第8页共10页苦:中医护理的基本特点是倡导整体护理,辨证施护,其精翻是扶正祛邪、标本漫急、同病异护、异病同护、末病先防、既病防变。现根据我科常见病举两个病创来体现中医护理在临床中的应用来帮助病人。1. 哮病:寒酵(1)主症:喉中哮鸣如水鸡声,呼吸急促,嘴憋气逆,痰多、色白多泡沫,易咳,恶寒,肢冷,面色青晦,舌苔白滑,脉弦紧或浮紧。(2) 调护方法:1)生活起居:病室应保持安静,保持空气新鲜,生活作息规律,避免尘埃和烟尘是刺激,病室周围避免种植可能诱发哮证发作的花草树木:枕头、被褥不宜用羽绒制品。。2)情志调理:多与病人沟通,寻找诱因,使患者学会调节和控制自己的情绪,使其保持心情舒畅,防止七情内伤。3)饮食指导:指导患者饮食宜清淡,多进食健脾补肺益肾,忌食辛辣、刺激 性食物及海腥鱼虾、生冷之品,戒烟酒。多吃新鲜蔬菜水果,保持大便通畅。4)药物指导:指导其中药宜饭后热服。哮病发作有规律者可在发作前1-2小时服药以缓解症状,服药后观察期效果和反应。5) 中医技术:采用针灸法,针刺定喘、天突、内关等穴,或根据病情遵医嘱采取冬病夏治,如穴位贴敷,食疗等,以达到扶正祛邪、防病治病的目的。6)健康指导:出院后指导患者慎起居,避风寒,防感冒,居室内禁放花、草、地毯等,禁止养宠物。流感流行时,尽量少去公共场所活动。一旦发现鼻痒、打喷嚏、咳嗽、须积极治疗,及时防治呼吸道感染。如有不适,随时就诊。2. 风温肺热:痰热壅肺(1) 主症:高 快煎,不宣久煎,过煮则降低药效。风寒感冒和体虚感冒者汤药宜热服,服药后再进热粥或热饮,卧床休息避风,盖被以利出汗,注意防过汗和汗出当风复感外邪。风热感冒者汤药宜温服,药后观察出汗、体温和伴随症状的变化。暑湿感冒者可给灌香正气口服液,注意用药后症状改善情况。服发汗药后,忌服酸酷生冷之品,以免收敛,影响发散效果,中病即止,不可过汗,以防伤阴。3、感冒的饮食护理答:饮食宜清淡富营养、易消化。风寒感冒者宜热食,忌生冷油腻,多喝热稀粥或饮生姜红糖茶,亦可用糯米、生姜、连须葱白煮制葱姜粥,趁热食用;风热感冒者宜食凉润之品,多补充水分,多食蔬菜水果,忌辛辣、油腻、煎炸之品;热盛口渴多汗者可给淡盐水、冬瓜汤、芦根茶等;暑湿感冒者宜清淡饮食,多食西瓜、薏苡仁粥、绿豆汤等清热解暑之品,忌食冷、甜、黏、油炸之品。体虚感冒者应根据不同的体质选用滋补类食物,气虚感冒者可选食山药粥、黄芪大枣粥、牛奶等健脾补气之品:阴虚感冒者可食用银耳、海參、甲鱼等滋阴清补之品。咳嗽1、咳嗽的病机答:内外邪气犯肺、肺失宣肃,肺气上逆。.2、咳嗽的症候分型答:1、外感咳嗽(1)风寒袭肺 (2)风热犯肺(3)风燥伤肺2、内份咳嗽(1)痰湿蕴肺(2)痰热郁肺(3)肝火犯肺(4)肺阴亏柜3、咳嗽的病情观察和饮食护理 P17嘭病和喘证1、時病和喘证的区别答:哮病和喘证都有呼吸急促的表现,哮必兼喘,而喘未必兼哮。喘以气息言,以呼吸急促困难为主要特征:哮以声响言,以发作时喉中哮鸣有声为主要临床特征。哮病为一种反复发作的独立性疾病,喘证是多种肺系急慢性疾病中的一个症状。2、腸证的穴位贴敷答:预防踹证发作可穴位贴敷消喘膏(白芥子、延胡索、甘遂、细辛研末加生姜汁调成育状),选肺俞、心俞、膈俞等穴夏季三伏天贴敷,以扶正祛邪。3、生活起居和健康教育 P22P27心1、心季的临床表现答:心跳异常,自觉心慌悸动不安,甚则不能自主,伴胸闷、乏力、眩晕、耳鸣、寐差、健忘等。2、心的基本病机答:气血阴阳亏虚,心失所养,邪扰心神,心神不宁。3、心悸的病情观察答:密切观察心率、心律、血压、脉象等变化,必要时给予心电监护。若见脉结代、呼吸不畅、面色苍白等心气衰微表现时,立即予以吸氧。心率维持在每分钟120次以上或40次以下或频发期前收缩,及时报告医生,予以处理。心阳不振,心力衰竭者,应注意观察其有无呼吸困难、喘促、咳吐粉红色泡沫痰的情况,给予吸氧,必要时加20%~30%酒精湿化后吸入,协助患者采取半卧位、坐位或垂足坐位。一旦患者出现胸中绞痛、喘促大汗、面色苍白、四肢厥冷等心阳暴脱危象,应及时配合医生进行抢救。不寐1、不寐的主要临床表现答:睡眠时间、深度的不足,不能消除疲劳以及恢复体力与精力。轻者入睡困难,寐而易醒,或时寐时醒,或醒后不能再寐:重者彻夜不能入睡,严重影响正常的生活、工作、学习和身心健康。2、不的基本病理答:3、不寐的证型答:心牌两虚 心胆气虚 心肾不交 肝郁化火 痰热扰心4、不寐的健康教育答:1、注重精神调摄,克服焦虑、紧张、抑郁、恐惧、愤怒、兴奋等不良情绪,适当参加社会活动,保持愉快舒畅的心情,恬淡虚无,精神内守。2、家居环境应保持静谧、舒适。养成合理作息、规律睡眠的习惯,睡前尽量放松,避免从事紧张、兴奋的活动,睡前可用温开水或中药煎汤泡脚。3、饮食有节,晚餐不宜过饱,忌浓茶、咖啡、醇酒,根据不同证型,选择补益气血或滋阴化痰等功效的食物,如山药莲子粥、红枣莲子粥、银耳發等。4、病后要注意调养,劳逸结合,适当从事体力劳动和体育运动,增强体质。病情许可时,可睡前适当散步。脑力劳动者,应坚持每日适当进行体育锻炼。眩晕1、眩晕的临床表现答:轻者闭目即止:重者如坐舟车,旋转不定,不能站立,伴恶心、呕吐、面色苍白、汗出,甚则仆倒等症状。2、眩晕的基本病机答:风阳上扰 肝肾亏虚 气血两虚 痰浊中阻 淤血内阻3、眩晕的生活起居答:居室光线柔和,温湿度适宜,避免强光和噪音刺激。璽症者绝对卧床休息,轻症者可闭目养神。指导患者变换体位或蹲、起、站立时动作应缓慢,避免头部过度动作,下床活动时要陪护在旁,防止发生意外。肝阳上亢、肾精不足者局处宜凉爽;气血亏虚、淤血阻窍者居处室温稍偏高,应做好保暖工作,预防感冒;痰浊中阻者居处宜干燥、温暖。劳逸结合,保证充足睡眠,适当体育锻炼,增强体质。中风1、中风的辩证要点答:1、辩中经络与中脏腑2、辩闭证与脱证3、辩病势顺逆P612、中风的证型及症候表现、代表方剂答:1、中经络(1)风痰入络 表现:头晕目眩,肌肤不仁,肢体麻木,甚则突发半身不遂,手足拘急,口眼喉斜,口魚流涎,言语不利,舌暗红,苔腻白,脉弦滑。方剂:真方白丸子(2)风阳上扰 表现:平素头痛头晕,耳鸣目眩,突发口眼喝斜,舌强语蹇,或手足重滞,甚则半身不遂,舌质红,苔黄,脉弦。方剂:天麻钩藤饮(3)阴虚风动 表现:平素眩晕耳鸣,腰膝酸软,突发口眼喝斜,半身不遂,语言蹇涩,舌质红,苔腻,脉弦细数。方剂:镇肝熄风汤2、中脏腑(1)闭证1)痰热腑实 表现:平素头痛眩晕,心烦易怒,突发昏仆,神志不清,半身不遂,肢体强痉,口黏痰多,伴腹胀便秘,舌质暗红,或有瘀斑、瘀点,苔黄腻,脉弦滑或弦涩。方剂:桃仁承气汤2)痰火郁闭 表现:突然昏仆,不省人事,牙关紧闭,半身不遂,口噤不开,两手握固,大小便闭,肢体强痉,面红目赤,鼻鼾痰鸣,躁扰不宁,舌质红绎,苔黄腻,脉弦滑数。方剂:羚角钩藤汤3)痰浊癌闭 表现:突然昏仆,不省人事,眼关禁闭,口噤不开,两手握固,肢体强急,大小便闭,痰涎壅盛,面白唇暗,静卧不烦,四肢不温,舌质暗淡,苔白腻,脉沉滑缓。方剂:涤痰汤(2)脱证 表现:突然昏仆,不省人事,手撒肢冷,肢体瘫软,目合口张,鼻鼾息微,汗出如珠,二便自遗,舌痿,苔白腻,脉微欲纯。方剂:参附汤3、恢复期(1)风痰瘀阻表现:半身不遂,肢体麻木,口眼喝斜,舌强语蹇或失语:舌质黯,苔滑腻,脉弦滑。方剂:解语丹(2)气虚血瘀表现:半身不送,偏身瘫软,伴肢体麻木无力,面色萎黄,舌质淡紫或紫黯,苔薄白,脉细涩或脉细无力。(3)肝肾亏虚:表现:半身不送,惠肢僵直拘率,舌强或失语,或偏身不用,肌肉装缩:眩晕耳鸣,腰膝酸软:舌质红,少苔,脉沉细。方剂:左归丸合地黄饮子3、中风的治护原则和护理措施答:P65胃痛1、胃痛的证型答:寒邪犯胃 食滞肠胃 肝胃气滞 胃热炽盛 瘀阻胃絡 胃阴亏虚 脾胃虛寒2、胃痛的病情观察答:观察胃痛的诱发和缓解因素、发作规律、疼痛部位、性质、持续时间、程度及伴随症状等。寒邪犯胃疼痛者多胃痛暴作,疼痛剧烈而拒技,喜暖恶凉:脾胃阳虚之虚寒胃痛,多隐隐作痛,喜温喜按,遇冷加剧:热结火郁,胃气失和之胃痛,多为灼痛,痛势急迫,伴有烦渴喜饮,喜冷恶热:瘀阻胃络之胃痛,多痛处固定,或痛有针刺感:胃痛且胀,大便秘结不通者多属实;痛而不胀,大便溏薄者多属虚;拒按者多实,喜按者多虚。初痛者多在气,久痛者多在血。胃痛剧烈者密切观察神志、血压、脉搏、面色、粪色等情况,若见大便色如柏油样,考虑有邪伤胃络的可能;若见面色苍白、汗出肢冷、血压下降、脉搏细数,为气随血脱:如见腹肌紧张、压痛、反跳痛,考虑胃穿孔,应及时报告医生,配合救治。未明确诊断前,勿随意使用止痛剂。3、胃痛的饮食护理答:饮食以易消化/富有营养/少量多餐为原则,忌食粗糙、辛辣、肥腻、过冷过热的食物:禁食不鲜、不洁食物;胃酸过多者,不宜食用醋、柠檬、山楂等过酸食物:疼痛剧烈、有呕血或便血量多时因暂禁食。脾胃虚寒者应选用具有温中、散寒、理气作用的食品,如生姜、红糖、萝卜等;肝胃气滞患者宜理气和胃解郁之品,如萝卜、柑橘、玫瑰花、合欢花等,悲伤郁怒时暂不进食,待病情缓解后,再进宽中理气消食之品,如萝卜、金橘、柠檬、槟榔等;胃阴不足者宜食润燥生津之品,如牛奶、豆浆、梨、藕等:密阻胃络患者宜食行气活血之品,如山楂、刀豆、薤白等。便秘1、便秘的辩证要点答:1、辩排便周期与性质1、辩虚实 P872、便秘的饮食护理答:饮食宜选择清淡、富含纤维素和油脂的食物。晨起空腹饮一杯淡盐水或蜂蜜水、酸奶、果汁等,有助于预防便秘的发生。热秘者宜多用清凉温润之物,如梨、黄瓜、苦瓜、萝卜、芹菜、莴苣等,忌食辛辣厚味食物,如辣椒、姜、羊肉等;气秘者宜用行气软坚润肠之物,如橘子、香蕉、竹笋等,忌收敛固涩之品,如白果、芡实、石榴等:气虚者多用健脾益气润s肠之物,如山药、扁豆等,忌用行气之品,如佛手、萝卜、芥菜等;血虚、阴虚者宜用滋阴养血洞燥之物,如桑葚、蜂蜜、芝麻、花生等,忌辛辣香燥之品,如辣椒、羊肉、五香调料等;阳虚者多食温润通便之品,如韭菜、羊肉、狗肉等。芪疽1、黄疸的临床特征答:以目睛黄染为主要特征。可分为明黄和阳黄。阴黄—晦暗如烟原,伴神疲,畏寒,苔白腻。阳黄—鲜明如橘,伴发热,口渴,苔黄腻。2、黄疸的辩证要点答:阳黄:热证、实证;起病急,病程短;黄色鲜明如橘色,口干发热,小便短赤,大便秘结,舌苔黄腻,脉弦数。急黄:阳黄之重症,起病急骤,色黄如金,兼见神昏、发斑、出血等危象。明黄:寒证、虚证;起病缓,病程长:黄色晦暗如烟票,脘闷腹胀,畏寒神疲,口淡不渴,舌淡白,苔白腻,脉濡缓或沉迟。3、黄疽的生活起居护理答:保持病室安静整洁,患者篅卧床休息,以利于养肝护肝,症状好转后,逐渐增加活动量。阳黄热重于湿者,病室宜偏凉:阳黄湿重于热者,病室宜温热,避免对流风;阴黄者要注意防寒保暖:急黄者应纯对卧床休息,病室宜凉爽。保持口腔清洁,可用淡盐水漱口。加强皮肤护理,汗出者及时换衣,保持床单位清洁,预防压疮。黄疸重者常皮肤瘙痒,局部可涂冰硼水止痒,避免搔抓,以免皮肤破溃引起感染。有传染性者应严格执行消化道和血液隔离制,度,以防疾病传播。4、黄疽的饮食护理答:饮食宣清淡、低脂、营养丰富、易消化,少食多餐,多饮水,忌油腻、醇酒等。勿过食酸味或辛燥香窜之品,防伤肝气。阳黄热重于湿者,宜食用甘凉的食物,如西瓜、冬瓜、绿豆粥及水果、蜂蜜等。阳黄湿重于热者,少食多餐,宜食用薏苡仁、赤小豆等,忌食纤维素较多及产气多的食物。阴黄者饮食宜温热,可食茵陈附子粥以利湿退黄,忌寒凉、生冷、甜腻碍胃之品。急黄者,饮食以清凉生津流质为宜,病情好转后再改为半流质,禁高蛋白食物,必要时鼻饲。保持大便通畅,减少氨的积聚,防止肝性脑病。哺乳期患者应暂停喂哺,待病情好转条件允许再继续哺乳。鼓胀1、鼓胀的临床表现答:腹大胀满,皮急如鼓,皮色苍黄,脉络显露为主要临床表现的病证。、2、鼓胀的证型答:(1)气滞湿阻(2)水湿困脾(3)水热蕴结(4)瘀结水流(5)阳虚水盛(6)阴虚水停3、鼓胀的病情观察答:密切观察腹胀以及腹水消长情况,观察尿量,协助患者准确记录24小时液体出入量,定期测量腹围、体重和血压。注意观察有无出血倾向,观察呕吐物、排泄物的变化,并观察神志、面色、脉搏、血压、蜘蛛痣、腹壁静脉曲张等变化。出血患者,应观察出血量、色、质,有无头晕、心悸等症状。若见患者有性格改变,举止反常,动作缓慢,睡眠异常等肝性脑病先兆表现,及时报告医生处理。水肿1、水肿的分型答:1、阳水:(1)风水泛滥 代表方剂:越婢加术汤(2)湿毒覆淫 代表方剂:麻黄连翘赤小豆汤合五味消毒饮(3)水湿漫溃 代表方剂:五皮饮合胃苓汤(4)湿热壅结 代表方剂:硫凿饮子2、阴水:(1)脾阳虚衰(2)肾阳衰微2、阴水和阳水的鉴别答:阳水:多因风邪外袭、疮毒内侵、水湿浸溃,致肺不宜降,脾不健运而成。发病较急,每成与数日之间,肿多由颜面开始,自上而下,继及全身,肿处皮肤绷急发亮,按之凹陷即起,兼有烦热、口渴、小便赤涩、大便秘结等表、热、实证,一般病程较短。阴水:多因饮食劳倦,先天或后天因素所致脾肾亏虚,气化不利所致。发病缓慢,肿多由足踝开始,自下而上,继及全身,肿处皮肤松弛,按之凹陷不易恢复,甚则按之如泥,兼见不烦渴、小便少但不赤涩、大便稀薄、神疲气怯等里、虚、寒证,病程较长。阴水与阳水可相互转化,阴水感受外邪可出现阳水症状,阳水日久失治则可见阴水表现,阴水亦常兼有风、寒、湿、热、毒、瘀等症,因此水肿以热寒夹杂,虚实互见者为多。癃闭1、癃闭和淋证鉴别答:淋证以小便频数短赤,滴沥刺痛,欲出未尽为特征,其小便量少,排尿困难与癃闭相似,但尿频而痛,且每天排出小便总量多为正常。癃闭则无刺痛,每天排出小便总量低于正常,.甚至无尿可解。2、癃闭和关格的鉴别答:二者主症都有小便量少或闭塞不通,但关格常由水肿、淋证、癃闭等经久不愈发展而来,是小便不通与呕吐并见的病证,常伴有皮肤瘙痒,口中尿味,四肢抽搐,甚至昏迷等症状。而癃闭不伴有呕吐,部分患者有水蓄膀胱之症候,以此可资鉴别。但癃闭进一步恶化可转变关格。故癃闭病情轻于关格。3、癃闭辩虚实(简答)答:癃闭的辩证以虚实为纲。因湿热蕴结、浊瘀阻塞、肝郁气滞、肺热气壅所致者,多属实证:因脾虚不升、肾阳亏虚、命门火衰,气化不及州都者,多属虚证。起病急骤,病程较短者,多数实证;起病较缓,病程较长者,多数虚证。体质较好,症见尿流窘迫,赤热或短涩,苔黄腻或薄黄,脉弦涩或数,多属实证:体质较差,症见尿流无力,精神疲乏,舌质淡,脉沉细弱者,多属虚证:时欲小便而不得出,神疲乏力者,多属虚证。4、癃闭的病因病机(选择)答:1、湿热蕴结2、肺热壅盛3、脾气不升 4、肾元亏虚5、肝郁气滞6、尿路阻塞5、癃闭的症候特点和代表方答:1、膀胱湿热 代表方:八正散2、肺热壅盛 代表方:清肺饮3、肝郁气滞 代表方:沉香散4、浊痰阻塞 代表方:代抵当丸5、脾气不升 代表方:补中益气汤合春泽汤6、肾阳衰惫 代表方:肾气丸7、肾阴亏耗 代表方:六味地黄丸合猪苓汤消渴(大题)1、消湯的病机答:阴津亏耗,燥热炽盛2、消焗的证型、护治原则及代表方答:1、燥热伤肺 护治原则:清热润肺,生津止渴 代表方:消渴方加减2、胃热炽盛 护治原则:清胃泻火,养阴增液代表方:玉女煎加减3、肾阴亏虚 护治原则:滋阴固肾,润燥止渴 代表方:六味地黄丸加减4、明阳两虚 护治原则:温阳滋阴,补肾固摄 伐表方:金匮肾气丸加减3、三消各自的特点和小便的特征答:上消:烦渴多饮,口舌干燥,尿频鱼多,舌边尖红,苔薄药,脉洪数。中消:多食易饥,口渴尿多,形体消瘦,大便干燥,苔黄,脉滑实有力。下消(肾阴亏虚):尿频量多,浑浊如脂膏,失眠心烦,乏力,头晕耳鸣,口干唇燥,皮肤干燥,瘙痒,舌红苔少,脉细数。下消(阴阳两虚):小便频数,甚至饮一漫二,浑浊如音,面色黧黑,耳轮干焦,腰膝酸软,形寒肢冷,阳痿早泄或月经不调,舌淡苔白有选印,脉沉细无力。头痛1、头痛的特点答:外感头痛、内伤头痛2、头痛的病因答:外感和内伤两端痹症(大題)1、痹症的特点答:肢体关节、肌肉疼痛,屈伸不利,或疼痛游走不定,甚则关节剧痛、肿大、强硬、变形。2、症的辨证分型、护治原则及代表方答:1、风寒湿痹(1)行痹 护治原则:祛风通络,散寒除湿 代表方:防风汤加减(2)痛痹 护治原則:散寒通络,祛风除湿 代表方:乌头汤加减(3)着痹 护治原则:除湿通络,祛风散寒 代表方:薏苡仁汤加减2、风热湿痹 护治原则:清热通络,祛风除湿 代表方:白虎加桂枝汤合宣痹汤加减3、痰癌痹阻 护治原则:化痰行,蠲(juan)闭通络代表方:双合汤加减4、肝肾亏虚 护治原则:培补肝肾,舒筋止痛 代表方:独活寄生汤加减3、痹症和痿症的鉴别答:痹症和痿症虽同是肢体疾患,但二者临床表现,病因病理都不同。鉴别要点首先在于痛与不同,狮症以关节痛为主,而痿症则为肢体漆弱,无疼痛症状。其次观察肢体的活动障碍,痿症是无力运动,痹症是因痒而影响活动。再者,都分痿症病初即有肌肉萎缩,而痹症则是由于疼痛甚或关节僵直不能活动,日久慶而不用导致肌肉萎缩。4、痹症的护理措施 P145疮疡1、疗和疖的鉴别会:疗:初起有票粒样脓头,形小、根深、肿硬、全身症状明显,病程较长。疖:肿势局限,范围 多小于3CM 左右,突起根浅,红肿疼痛,易肿、易溃、易敛。:有头疽的表现导:多发于项背肌肉丰厚之处。初起有一粟米粒样脓头,而后肿势逐渐扩大,脓头相继增多,溃烂后状如莲蓬、蜂窝,红肿范围常超过9-12CM,全身症状明显,病程较长。易发生内陷。乳癖1、乳癖与乳岩的鉴别答:乳癖:单侧或双侧乳房疼痛并出现肿块,肿块大小不等,形态不一,边界不清,之地不硬,活动度好。本病好发于25~45 岁的中青年女性乳岩:多发生于40-60岁中老年妇女,乳房肿块多无疼痛,质地坚硬,表面凹凸不平,边界不清,常与周围皮肤粘连,活动度差,可有惠侧淋巴结肿大,晚期肿块溃破呈菜花样。痨疮1、待疮的分期(小题)答:一期:清核较小,如黄豆或蚕豆大,色鲜红,质柔软,无疼痛,不脱出,以便血为主。二期:寿核较大,形似红枣,色暗红,便时脱出肛外,便后可自行回纳,便血或多或少。三期:持核更大,如鸡蛋或更大,色灰白,大便时甚或行走时,瘠核脱出肛外,不能自行回纳,须用手推回。便血多,或不出血。瘠核脱出后,如不尽快回纳,则易嵌顿而绞窄肿胀、糜烂坏死。2、混合疼的特点答:便血及肛门部肿物,可有肛门坠胀、疼痛或异物感,局部可有分泌物或伴瘙痒。结合检查可见肛管内齿线上、下同一方位出现肿物。3、内時与直肠癌鉴别(简答)答:内:内特多发于成年人。初发常以无痛性便血为主要症状,血液与大便不相混,多在排便时滴血或射血。出血呈间歇性,每因饮酒、过劳、便秘或腹泻时便血复发和加重。出血严重时可引起贫血。肛查见齿线上黏膜呈半球状隆起,色鲜红、暗红或灰白。随着痔核增大,在排便或咳嗽时可脱出肛外,若不及时回纳,可形成内嵌顿,并有分泌物溢出,肛门坠张。1指检时触及菜花状肿块或凹凸不平的溃疡,质地坚硬,推之不移。月经失调1、月经失调的证型和方药答:1、脾气虚 补中益气汤加减2、肾气虚 当归地黄饮或固阴煎3、阳盛血热 清经散4、阴虚血热 两地汤..5、肝郁血热 丹栀逍遥散6、血虚证 大补元煎7、阴虚证 左归饮合加减一阴煎8、血寒证(1)虚寒证 温肾调气汤9、气滞证 乌药汤(2) 实寒证 温经汤2、月经失调的护理P219痡经1、痛经的症候分型答:1、肾气亏损2、气血虚弱3、气滞血瘀4、寒凝血瘀5、湿热痰阻2、痛经的月经表现答:绝经前后诸证1、绝经前后诸证的临床表现答:烘热面赤、汗出、烦躁易怒、眩晕耳鸣、心悸失眠、腰背酸痛、手足心热、面浮肢肿等。2、绝经前后诸证的健康教育到份容:1、注意劳逸结合,生活规律,调畅情志,睡眠充足,增加活动,加强锻炼,增强体质;提高抵抗力2、定期检查,无病先防,有病早治。注意月经变化,如果经期延长太久,经量太多,或停经后又出现阴道流血,或白带增多时,应及早检查。3、为绝经期妇女提供绝经期相关知识,为顺利度过这以时期提供心理支持,以提高患者的自我调控能力。带下病1、带下病的临床表现答:带下明显增多或减少,色、质、气味发生异常,或伴有局部、全身症状。2、带下病的症候分型答:1、脾虚2、肾阳虚3、阴虚夹湿 4、湿热下注5、热𩆨蕴绪胎漏、胎动不安 P245小儿泄泻小儿泄泻的证型答:1、常证(1)风寒泻 (2)湿热泻(3)伤食泻(4)脾虚泻(5)脾肾阳虚泻2、变证(1)气明两伤(2)阴竭阳脱惊风惊风的四证八候答:搐、搦、掣、颜、反、引、窜、视,古人称之 “惊风八候”惊、风、热、痰四证中次复印店.先建第一豪,1]中医临床护理学1、简述月经先期血热型的中医护理特点(分阴虚血热/阳盛血热/肝郁化热三个方面)。答:阴虚血热:1)注意多休息,避免过劳和剧烈运动,如打球。游泳、跑步等,避免淋雨和洗冷水澡等。。2)嘱病人多饮开水,以充分补水,汗出时应及时擦干,以防着凉。3)中药汤剂不宜久煎,宜偏凉服。可选用乌鸡白凤丸或六味地黄丸,经后始服,经行停药。4)平时配合滋阴生津之食疗。如:炖甲鱼、玉竹煲鸡菇汤、茜草乌龟汤、淡菜墨鱼汤、阿胶炖瘦肉、等,多食鱼肉、蛋、银耳及各种新鲜蔬菜和水果、亦可频服莲藕汁、甘蔗汁以清热生津,忌燥热、辛辣刺激助阳之品。5)保持心情舒畅,避免激动,忧郁过度等情绪变化。6)可用针灸治疗的方法:取关元、血海、三阴交等穴,毫针刺平补平泻法。7)教导病人有关本病的知识。对已婚妇女做好计划生育宣教工作,指导病人使用合适的有效的节育措施,尽量减少人流损害宫腔,宜节制房事,防止房劳伤肾。阳盛血热:1)如有腹痛禁止热敷下腹。注意多休息,劳逸结合,避免剧烈运动。2)可服食藕汁、生地汁、鲜旱莲草汁等以清热凉血止血,忌食辛辣煎炸助阳动火之品。3)中药汤剂宜饭后凉服。可选用固经丸或宫泰冲剂。4)针灸方法:取关元、气海、曲池、三阴交等穴,毫针刺用平补平泻法。5)保持情绪稳定,避免烦躁、恼怒等不不良情绪的刺激。6)指导病人有关本病的知识。肝郁化热:1)生活起居有常,注意多休息,劳逸结合,避免剧烈运动等。2)饮食宜选用月季花粥,或用佛手10g泡茶,随意饮用,忌食辛辣刺激之品。3)中药汤剂宜饭后凉服。可选用丹栀逍遥丸服用。4)调整心态,以保持气血平和,心情舒畅,避免精神刺激,树立战胜疾病的信心。5)针灸方法:取气海、三阴交、太冲等穴,毫针刺用泻法。6)教导病人有关本病的知识。对已婚妇女做好计划生育宣教工作,指导病人使用合适的有效的节育措施,尽量減少人流损害宫腔,宜节制房事,防止房劳伤肾。2、简述月经后期血虚型的中医护理要点。答:月经后期血虚型的中医护理要点为:1)病室环境保持整洁、舒适、安静、空气新鲜,室温宜偏暖,根据气候变化增减衣被,注意保暖。2)应卧床休息,经期不宜劳累。3)多与患者交流,以了解其生活起居、饮食、睡眼情志等情况:及时与病人的家属共同做好病人的情志护理。4)严密观察病人的面色、脉象、舌脉、汗出、二便、月经周期等,必要时嘱病人保留经垫,估计出血量或观察经血的颜色。5)保持外阴清洁,指导阴道分泌物多的病人每日清洁会阴,对不能自理者,每日应予会阴消毒1-2次,勤换内裤及经垫,内裤在阳光下暴晒6小时以上或及时烘干。6)加强营养,胃纳佳者,可进血肉有情之品补之,如瘦肉、猪肝、肌肉、鱼肉之类;如脾胃欠佳者,则宜先健运脾胃,以素食为主,适当顿服精瘦肉淮杞子汤,或牛脯杞子汤。忌辛辣油腻之品。7)中药汤剂宜用文火久煎,热服、顿服。8)按医嘱准确给药,观察药后效果和反应。9)保持大便通畅,减少腹压,防止出血。10) 有传染病者,执行传染病隔离常规:如须刮宫者,按刮宫护理。3、简述气滞血瘀型/寒凝血瘀痛经的中医护理要点。答:气滞血瘀型痛经中医护理要点:1)药物方法:偏气滞者,选用七制香附丸或坤顺丹;偏血瘀者,选用痛经丸:痛时亦可服元胡粉1.5g,每日2次。2)外治法:丁香、肉桂、元胡、木香各10g,研末和匀,于经前两天或疼痛发作时,取2g药粉置胶布上,贴关元穴:若疼痛不止,加贴双侧三阴交穴。3)针灸方法:取中极、气海、血海、三阴交、太冲、合谷等穴,毫针用泻法。4) 推拿方法:睡前排尿后仰卧,由中极至气海、天枢至归来反复揉按约3-5min,手法由轻至重,用拇指点按气海穴 2min,用拇指揉捏双侧三阴交穴约 2min。5)饮食方法:选用桃仁生地粥或选用糖醋益母膏。6)情志方法:帮助患者解决心理负担,开导其乐观对待生活,保持心情舒畅。7)指导患者本病的相关知识及注意月经期的经期卫生。8)注意多休息,劳逸结合,防止过劳,节制房事。寒凝血瘀痛经的中医护理要点:1)药物方法:选用艾附暖宫丸或温经丸。或用艾叶 10g,生姜2片,红糖适量,水煎服,每日2次。外治法:肉桂、细辛、吴茱萸、元胡、乳香、没药各 10g研末拌匀,于经前2天取药粉2-3g 置于5号阳和膏中粘匀,贴于神阙穴处,隔日一次,至行经3天止。三个月经周期为一疗程。2) 针灸方法:针刺关元、中极、地机、三阴交:艾灸气海、关元、次膠、阿是穴。3)饮食方法:选用桂浆粥。忌食辛辣刺激生冷的食物。4)注意多休息,注意保暖,特别是腹部、腰部,劳逸结合,避免过劳和纵欲过度、5)保持心情舒畅,避免精神刺激,戒郁怒。6)与患者讲解有关本病的相关知识。4、简述肾阴虚型/肾阳虚型“绝期前后诸证”的中医护理要点。答:1)注意休息,室内保持整洁、安静,空气流通。肾阴虚者病室宜凉爽、光线柔和:肾阳虚病室宜阳光充足,注意保暖,勿受风寒。2)做好情志护理。医务人员应耐心解答病人提出的问题,并予指导解决。对病人恐惧忧虑的心理可采用心理疏导、家庭调节。避免不良的精神刺激,对失眠、烦躁不安及情绪激动者,可按医嘱适当用镇静剂。3)合理安排生活,适当调节或保持工作的节奏与休息的关系,避免过重的工作负担。4)饮食宜清淡且营养丰富,应多食各种新鲜水果及蔬菜,少食油腻及含脂肪较高的食物,少吃糖,避免高盐饮食,注意补充钾和钙,每日补充钙约1g,即每日造成和睡前饮一杯热鲜奶。对于月经频繁,经血量多,出血时间延长时,饮食宜选高蛋白、含铁多的食物,如鸡蛋、动物内脏、牛、羊、瘦肉及牛奶等。肾阴虚宜低盐,可佐以滋补肝肾之品,如枸杞子、何首乌等煲汤或煮粥食用。肾阳虛者宜选一些温补之品,如牛肉、猪肝、猪腰。冬季宜食羊肉、狗肉等以温肾阳,浮肿者宜低盐饮食,并可选食冬瓜、赤小豆、鲤鱼汤,以利水消肿,可佐以温补肾阳之品,食欲不佳,厌油腻者可用红枣、桂圆煲汤饮用。5) 注意阴部清洁卫生,勤换经垫及内裤,经期忌盆浴,预防泌尿生殖器发生感染。6)教会病人观察月经周期、阴道排出物、出血量正常与异常等情况,如出现异常,应报告医护人员,以使能得到及时处理。T)经常巡视病房,了解病人的生活所需及思想动态,及时予以解决。8)肾阴虚者中药宜饭前温服,每日1次,肾阳虚者宜饭前热服,并观察服药后效果和反应。9)注意劳逸结合,调畅情志,保持乐观,避免精神刺激,定期体检。5、简述肾虚型胎动不安的中医护理要点。答:1)病室空气清新,温湿度适宜,宜安静,注意多休息和保暖,避风寒,慎起居、防止外感等疾病发生。2)药物方法:选用寿胎丸。补肾健脾,补气养血安胎等补益药物宜文火久煎,饭前温服。3)饮食方法:选用艾叶鸡蛋汤。或菟丝子粥,每日早晚热服。宜多吃蔬菜和水果,保持大便畅通:若大便秘结者,每日早晚服蜂蜜1匙:或麻仁丸6g:每晚1次,以利润肠通便,减少腹压,防止再度出血。4)情志方法:保持情绪安定,做好精神护理,孕期严禁房事,避免劳力持重。5)向患者及家属说明流产的可能原因,以及经积极稳妥治疗后,大多可继续正常妊娠、分娩健康婴儿。解除不必要的顾虑和紧张情绪,抑郁、忧思、恼怒、悲伤均可影响气机,使气血逆乱,胎失载养。6、简述气血虚弱型胎漏的中医护理要点。答:1)病室宜空气流通、整洁、舒适,湿、温度适宜。注意保暖,室温宜偏暖,告知孕妇/配偶暂停性生活。2)经常巡视病房,了解病人的生活所需,协助料理生活,外出检查应有人陪同,勿让病人单独去厕所,勿使用蹲厕,尽可能使病人适应使用便盆,以收集和观察排出物、出血的色、质、量情况,并做好记录。3)阴道流血时应绝对卧床休息,待症状消失后可适当下床活动。并向病人说明诱发胎漏的原因,避免过劳、攀高举重、灌肠、阴道检查及情绪变化无常等因素诱发胎漏。4)饮食宜营养丰富、易消化之食品,如鸡蛋、牛奶、瘦肉、鱼类、蔬菜、水果等,以提供胎儿生长发育的需要。忌生冷寒凉滑利或辛辣刺激之品,如薏苡仁、绿豆等。气虚者多食益气健脾养血之品,中药汤剂宜文火久煎,热服。5) 保持大便通畅,如大便燥结难解者,每日草晚用温开水冲蜂蜜饮用以润肠通便,减少腹压,防止出血:6)保持外阴清洁,勤换巾垫及内裤,每天用温水或1:5000 高福酸钾溶液清洁会明1-2次,预防感染。T)指导病人正确测量基础体温,若病人的晨温不降一般提示预后良好,若晨溫下降者,多提示保胎希望不大。8)有高血压病史者,每天测量血压和体重,以便为医疗提供依操。9)保证充足睡眠,失眠者可以通过听音乐、喝热牛奶、热水泡足等方法诱导睡10)做好健康指导:指导病人孕期保健,慎房事,慎起居,生活婴有规律,防止感冒的发生,送免负重攀高,防止跌扑,保证睡眠充足,重胎教、利优生宽衣带,定期作孕期保健检查,确保优生优育。如有坠胎、小产、滑胎病史,则夫妻双方要作检查,如出现孕期下血、要卧床休养,并接受医护指导,不能自行用药,凡安脑失败者,嘱下次受孕时间相隔不能太近,应避孕半年至一年再孕,以利于肾气复原,恢复胞宫功能,防止下次漏胎发生。中医护理在临床中的实际应用,举两到三个病例谈你如何运用中医护理的方法帮助护理病人。答:中医护理的基本特点是倡导整体护理,辨证施护,其精髓是扶正祛邪、标本缓急、同病异护、异病同护、末病先防、既病防变。现根据我科常见病举两个病例来体现中医护理在临床中的应用来帮助病人。1. 哮病:寒哮(1) 主症:喉中哮鸣如水鸡声,呼吸急促,喘憋气逆,痰多、色白多泡沫,易咳,恶寒,肢冷,面色青晦,舌苔白滑,脉弦紧或浮紧。(2)调护方法:1)生活起居:病室应保持安静,保持空气新鲜,生活作息规律,避免尘埃和烟尘是刺激,病室周围避免种植可能诱发哮证发作的花草树木:枕头、被褥不宜用羽绒制品。。2)情志调理:多与病人沟通,寻找诱因,使患者学会调节和控制自己的情绪,使其保持心情舒畅,防止七情内伤。3) 饮食指导:指导患者饮食宜清淡,多进食健脾补肺益肾,忌食辛辣、刺激 性食物及海腥鱼虾、生冷之品,戒烟酒。多吃新鲜蔬菜水果,保持大便通畅。4)药物指导:指导其中药宜饭后热服。哮病发作有规律者可在发作前1-2小时服药以缓解症状,服药后观察期效果 function enter(pid){
  const items = itemsFor(pid);
  if(!items.length){ toast(pid === "wrong" ? "错题本还是空的，先去做题吧" : "该卷暂无题目"); return; }
  if(pid === "wrong") WANS = {};
  cur = { id: pid, title: pid === "wrong" ? "错题本" : secById(pid).title, items };
  if(P[pid] == null) P[pid] = 0;
  if(!ST[pid]) ST[pid] = Date.now();
  P[pid] = Math.max(0, Math.min(P[pid], items.length-1));
  cur.idx = P[pid];
  view = "quiz";
  renderQuiz(); startTimer(); window.scrollTo(0,0);
}

function startTimer(){
  stopTimer();
  timerId = setInterval(()=>{
    const el = document.getElementById("timer");
    if(el && cur && ST[cur.id]) el.textContent = fmtTime((Date.now()-ST[cur.id])/1000);
  }, 1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

/* ---------------- 首页 ---------------- */
function goHome(){
  stopTimer(); cur = null; view = "home"; renderHome(); window.scrollTo(0,0);
}

function renderHome(){
  const pids = SECTIONS.map(s=>s.id);
  const cards = SECTIONS.map((sec, i)=>{
    const st = statsOf(sec.id);
    const icon = sec.id === "t" ? "教" : ("一二三四五六"[i] || String(i+1));
    const prog = st.done
      ? `<span class="prog">已答 ${st.done}/${st.n} · 正确率 ${st.acc}%${st.done===st.n?" · 已完成":""}</span>`
      : `<span class="prog zero">尚未开始</span>`;
    const redo = st.done ? `<button class="redo" onclick="event.stopPropagation();resetPaper('${sec.id}')">重做</button>` : "";
    return `<div class="mode" role="button" tabindex="0" onclick="enter('${sec.id}')">
      <span class="ico">${icon}</span>
      <span class="txt"><b>${sec.title}</b><span class="sub">${sec.desc || ""}</span>${prog}</span>
      <span class="right"><span class="num">${st.n} 题</span>${redo}</span>
    </div>`;
  }).join("");

  const wrongCard = `<div class="mode wrongcard" role="button" tabindex="0" onclick="enter('wrong')">
      <span class="ico">错</span>
      <span class="txt"><b>错题本${W.length?`<i class="badge">${W.length}</i>`:""}</b>
        <span class="sub">做错的题自动汇总，掌握后可移出</span>
        <span class="prog${W.length?"":" zero"}">${W.length?`共 ${W.length} 题待复习`:"暂无错题"}</span>
      </span>
      <span class="right"><span class="num">${W.length} 题</span></span>
    </div>`;

  $("#app").innerHTML = `<div class="wrap">
    <div class="hero">
      <div class="eyebrow">中医临床护理学 · 课程复习</div>
      <h1>中医临床护理学</h1>
      <p class="sub">选择题练习 · 按题库刷题</p>
      <div class="hero-stats"><span><b>${TOTAL}</b>道题</span><span><b>${SECTIONS.length}</b>个题库</span><span>进度自动保存 · 错题自动汇总</span></div>
    </div>
    <div class="sec-title">开始练习</div>
    <div class="grid">${wrongCard}${cards}</div>
    <p class="foot">说明：每个题库的作答进度会自动保存在本机，返回首页后再点进去仍接着上次；想重来点卡片右下角“重做”。答错的题会自动进入“错题本”，在错题本里点“已掌握，移出”即可移除。</p>
  </div>`;
}

function resetPaper(pid){
  const st = statsOf(pid);
  if(!confirm(`重做「${secById(pid).title}」？\n\n该卷已答 ${st.done}/${st.n} 的记录会清空（错题本中的题目不受影响）。`)) return;
  Object.keys(A).forEach(k=>{ if(k.indexOf(pid+":") === 0) delete A[k]; });
  wr(K_ANS, A);
  delete P[pid]; wr(K_POS, P);
  delete ST[pid]; wr(K_START, ST);
  renderHome();
  toast("已清空该卷记录");
}

/* ---------------- 答题页 ---------------- */
function renderQuiz(){
  const items = cur.items;
  const i = Math.min(cur.idx, items.length-1);
  cur.idx = i;
  P[cur.id] = i; wr(K_POS, P);
  const it = items[i];
  const a = getAns(it.key);
  const answered = !!(a && a.ok !== null && a.ok !== undefined);
  const sel = a ? a.sel : null;

  let done = 0, right = 0;
  items.forEach(x=>{
    const b = getAns(x.key);
    if(b && b.ok !== null && b.ok !== undefined){ done++; if(b.ok) right++; }
  });

  const opts = it.o.map((text,k)=>{
    let cls = "opt", tag = "";
    const isCorrect = it.t === "multi" ? (Array.isArray(it.a) && it.a.indexOf(k) >= 0) : (k === it.a);
    const isPicked = it.t === "multi" ? (Array.isArray(sel) && sel.indexOf(k) >= 0) : (k === sel);
    if(answered){
      if(isCorrect){ cls += " correct"; tag = `<span class="tag">${isPicked?"正确":"正确答案"}</span>`; }
      else if(isPicked){ cls += " wrong"; tag = `<span class="tag">你的选择</span>`; }
      else { cls += " dim"; }
    }else if(isPicked){
      cls += " sel";
    }
    return `<button class="${cls}" onclick="pick(${k})" ${answered?"disabled":""}>
      <span class="lab">${it.t === "tf" ? (k===0?"√":"×") : LETTERS[k]}</span>
      <span class="txt">${text}</span>${tag}
    </button>`;
  }).join("");

  let feedback = "";
  if(answered){
    const ok = a.ok === true;
    feedback = `<div class="feedback ${ok?"ok":"no"}">
      <span class="mk">${ok?"✓":"✕"}</span>
      <span>${ok?"回答正确":"回答错误"}${ok?"":`，正确答案：${answerText(it, it.a)}`}</span>
    </div>
    ${it.e ? `<div class="exp"><b>解 析</b><p style="margin:0">${it.e}</p></div>` : ""}`;
  }

  const isWrongMode = cur.id === "wrong";
  const inWrongList = W.indexOf(it.key) >= 0;

  let wrongBar = "";
  if(isWrongMode){
    wrongBar = `<div class="tfhint">这道题来自「${it.src}」。
      <button class="btn danger" style="padding:6px 12px;font-size:12.5px;margin-left:8px" onclick="removeCurrent()">已掌握，移出</button>
    </div>`;
  }else if(answered && a.ok === false && inWrongList){
    wrongBar = `<div class="tfhint">已加入错题本，可在首页「错题本」里复习。</div>`;
  }

  const action = answered
    ? `<button class="btn primary" onclick="nextFromCard()">${i === items.length-1 ? (isWrongMode ? "完成本组" : "查看本次成绩") : "下一题 →"}</button>`
    : `<button class="btn primary" onclick="submitCurrent()" ${sel===null||sel===undefined||(Array.isArray(sel)&&sel.length===0)?"disabled":""}>提交本题</button>`;

  $("#app").innerHTML = `<div class="wrap">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()" aria-label="返回">←</button>
      <div class="tb-title">${cur.title}<span>${i+1} / ${items.length}</span></div>
      <div class="timer" id="timer">${fmtTime((Date.now()-(ST[cur.id]||Date.now()))/1000)}</div>
      <button class="textbtn" onclick="finishNow()">结束</button>
    </div>
    <div class="progress"><i style="width:${Math.round(done/items.length*100)}%"></i></div>
    <div class="statline"><span>已答 <b>${done}</b></span><span class="ok">正确 <b>${right}</b></span><span class="no">错误 <b>${done-right}</b></span><span style="margin-left:auto">自动保存</span></div>

    <div class="qcard" id="qcard">
      <div class="qmeta">
        <span class="pill">${it.t === "tf" ? "判断题" : (it.t === "multi" ? "多选题" : "单选题")}</span>
        <span class="pill gray">${it.src}</span>
        <span class="qno">第 ${i+1} 题</span>
      </div>
      <div class="stem">${it.q}</div>
      <div class="opts">${opts}</div>
      ${feedback}
      ${wrongBar}
      <div class="actions">${action}</div>
    </div>
  </div>
  <div class="navbar"><div class="inner">
    <button onclick="prevQ()" ${i===0?"disabled":""}>← 上一题</button>
    <button class="mid" onclick="openSheet()">答题卡</button>
    <button onclick="nextQ()" ${i===items.length-1?"disabled":""}>下一题 →</button>
  </div></div>`;
}

function answerText(it, v){
  if(v === null || v === undefined) return "未答";
  if(it.t === "multi") return (Array.isArray(v) ? v : []).map(i=>LETTERS[i]).join("") || "未答";
  return it.t === "tf" ? it.o[v] : LETTERS[v];
}

function pick(k){
  if(!cur) return;
  const it = cur.items[cur.idx];
  const a = getAns(it.key);
  if(a && a.ok !== null && a.ok !== undefined) return;
  if(it.t === "multi"){
    const arr = (a && Array.isArray(a.sel)) ? a.sel.slice() : [];
    const pos = arr.indexOf(k);
    if(pos >= 0) arr.splice(pos,1); else arr.push(k);
    arr.sort((x,y)=>x-y);
    setSel(it.key, arr);
  } else {
    setSel(it.key, k);
  }
  const y = window.scrollY;
  renderQuiz();
  window.scrollTo(0, y);
}

function submitCurrent(){
  const it = cur.items[cur.idx];
  const a = getAns(it.key);
  if(!a || a.sel === null || a.sel === undefined){ toast("请先选择一个选项"); return; }
  if(a.ok !== null && a.ok !== undefined) return;
  const ok = it.t === "multi" ? sameSet(a.sel, it.a) : (a.sel === it.a);
  setOk(it.key, ok);
  if(!ok && cur.id !== "wrong") addWrong(it.key);
  renderQuiz();
  const card = document.getElementById("qcard");
  if(card){
    const top = card.getBoundingClientRect().top + window.scrollY - 70;
    window.scrollTo({top, behavior:"smooth"});
  }
  if(ok && cur.id === "wrong") toast("答对了，可以点“已掌握，移出”");
}

function removeCurrent(){
  const it = cur.items[cur.idx];
  delete WANS[it.key];
  delWrong(it.key);
  toast("已移出错题本");
  const left = W.length;
  if(!left){ goHome(); return; }
  const idx = cur.idx;
  cur.items = itemsFor("wrong");
  cur.idx = Math.min(idx, cur.items.length-1);
  renderQuiz();
}

function nextFromCard(){
  if(cur.idx === cur.items.length-1){
    if(cur.id === "wrong"){ renderWrongDone(); return; }
    renderSummary(); return;
  }
  nextQ();
}
function nextQ(){
  if(cur.idx < cur.items.length-1){ cur.idx++; P[cur.id]=cur.idx; wr(K_POS,P); renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
}
function prevQ(){
  if(cur.idx > 0){ cur.idx--; P[cur.id]=cur.idx; wr(K_POS,P); renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
}
function finishNow(){
  if(cur && cur.id === "wrong"){ renderWrongDone(); return; }
  let done = 0;
  cur.items.forEach(x=>{ const b=getAns(x.key); if(b && b.ok!==null && b.ok!==undefined) done++; });
  if(!done){ toast("还没有作答任何题目"); return; }
  if(confirm(`已完成 ${done} 题，查看本次成绩？`)) renderSummary();
}

/* ---------------- 答题卡 ---------------- */
function openSheet(){
  const cells = cur.items.map((it,k)=>{
    const a = getAns(it.key);
    const answered = !!(a && a.ok !== null && a.ok !== undefined);
    let cls = "";
    if(answered) cls = a.ok ? "ok" : "no";
    else if(a && a.sel !== null) cls = "sel";
    if(k === cur.idx) cls += " cur";
    return `<button class="${cls}" onclick="jumpTo(${k})">${k+1}</button>`;
  }).join("");
  const done = cur.items.filter(x=>{const b=getAns(x.key); return b && b.ok!==null && b.ok!==undefined;}).length;
  const wrap = document.createElement("div");
  wrap.className = "overlay"; wrap.id = "sheetOverlay";
  wrap.onclick = e => { if(e.target === wrap) closeSheet(); };
  wrap.innerHTML = `<div class="sheet">
    <h3>答题卡</h3>
    <div class="hint">${cur.title} · 已答 ${done}/${cur.items.length}</div>
    <div class="legend">
      <span><i style="background:#178a5e"></i>答对</span>
      <span><i style="background:#c9463f"></i>答错</span>
      <span><i style="background:#2f7ab5"></i>已选未提交</span>
      <span><i style="background:#e2eaf3"></i>未答</span>
    </div>
    <div class="sheet-grid">${cells}</div>
    <div style="height:14px"></div>
    <button class="btn ghost" style="width:100%" onclick="closeSheet()">关闭</button>
  </div>`;
  document.body.appendChild(wrap);
}
function closeSheet(){ const el = document.getElementById("sheetOverlay"); if(el) el.remove(); }
function jumpTo(k){ cur.idx = k; P[cur.id]=k; wr(K_POS,P); closeSheet(); renderQuiz(); window.scrollTo(0,0); }

/* ---------------- 成绩 ---------------- */
function renderSummary(){
  stopTimer(); view = "summary";
  const items = cur.items;
  let done=0, right=0; const wrongs=[];
  items.forEach((x,k)=>{
    const b = getAns(x.key);
    if(b && b.ok !== null && b.ok !== undefined){ done++; if(b.ok) right++; else wrongs.push(k); }
  });
  const rate = done ? Math.round(right/done*100) : 0;
  const secs = Math.floor((Date.now() - (ST[cur.id] || Date.now()))/1000);
  const chips = wrongs.slice(0,80).map(k=>`<button class="chip" onclick="jumpFromSummary(${k})">第 ${k+1} 题</button>`).join("");

  $("#app").innerHTML = `<div class="wrap">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()" aria-label="首页">←</button>
      <div class="tb-title">本次成绩</div>
      <div class="timer">${fmtTime(secs)}</div>
    </div>
    <div class="scorecard">
      <div class="ring" style="--p:${rate}"><div class="in"><b>${rate}%</b><small>正确率</small></div></div>
      <h2>${cur.title} 已完成</h2>
      <p>已答 ${done} / ${items.length} · 用时 ${fmtTime(secs)}</p>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${done}</b><span>已答</span></div>
      <div class="stat ok"><b>${right}</b><span>正确</span></div>
      <div class="stat no"><b>${done-right}</b><span>错误</span></div>
      <div class="stat"><b>${items.length-done}</b><span>未答</span></div>
    </div>
    ${wrongs.length ? `<div class="card"><h3>本卷错题（点击回看解析）</h3><div class="chips">${chips}</div></div>`
                    : `<div class="card"><h3>没有错题，继续保持</h3></div>`}
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">
      ${wrongs.length ? `<button class="btn primary" style="flex:1;min-width:140px" onclick="jumpFromSummary(${wrongs[0]})">逐题看错题</button>` : ""}
      <button class="btn ghost" style="flex:1;min-width:120px" onclick="goHome()">返回首页</button>
    </div>
  </div>`;
  window.scrollTo(0,0);
}
function jumpFromSummary(k){
  cur.idx = k; P[cur.id]=k; wr(K_POS,P);
  view = "quiz"; renderQuiz(); startTimer(); window.scrollTo(0,0);
}

function renderWrongDone(){
  stopTimer(); view = "wrongdone";
  const items = cur.items;
  let done = 0, right = 0;
  items.forEach(x=>{ const b = getAns(x.key); if(b && b.ok!==null && b.ok!==undefined){ done++; if(b.ok) right++; } });
  const left = W.length;
  const wrongLeft = items.filter(x=>{const b=getAns(x.key); return b && b.ok===false;}).length;
  $("#app").innerHTML = `<div class="wrap">
    <div class="topbar">
      <button class="iconbtn" onclick="goHome()" aria-label="首页">←</button>
      <div class="tb-title">错题本</div>
    </div>
    <div class="scorecard">
      <div class="ring" style="--p:${done?Math.round(right/done*100):0}"><div class="in"><b>${done?Math.round(right/done*100):0}%</b><small>本组正确率</small></div></div>
      <h2>这组错题已过完</h2>
      <p>本组 ${items.length} 题 · 答对 ${right} 题 · 答错 ${wrongLeft} 题</p>
    </div>
    <div class="statgrid">
      <div class="stat"><b>${items.length}</b><span>本组题数</span></div>
      <div class="stat ok"><b>${right}</b><span>答对</span></div>
      <div class="stat no"><b>${wrongLeft}</b><span>仍答错</span></div>
      <div class="stat"><b>${left}</b><span>错题本剩余</span></div>
    </div>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" style="flex:1;min-width:140px" onclick="enter('wrong')">再刷一遍</button>
      <button class="btn ghost" style="flex:1;min-width:120px" onclick="goHome()">返回首页</button>
    </div>
    <p class="foot">觉得哪道已经掌握了，回到题目里点“已掌握，移出”即可。</p>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------------- 键盘 ---------------- */
document.addEventListener("keydown", e=>{
  if(!cur || view !== "quiz") return;
  if(document.getElementById("sheetOverlay")) return;
  const k = e.key.toUpperCase();
  if(LETTERS.includes(k) && k.length === 1){
    const idx = LETTERS.indexOf(k);
    if(idx < cur.items[cur.idx].o.length){ pick(idx); e.preventDefault(); }
  }else if(/^[1-5]$/.test(e.key)){
    const idx = Number(e.key)-1;
    if(idx < cur.items[cur.idx].o.length){ pick(idx); e.preventDefault(); }
  }else if(e.key === "Enter"){
    const a = getAns(cur.items[cur.idx].key);
    if(!a || a.ok === null) submitCurrent(); else nextFromCard();
  }else if(e.key === "ArrowRight"){ nextQ(); }
  else if(e.key === "ArrowLeft"){ prevQ(); }
});

renderHome();

</script>
</body>
</html>
